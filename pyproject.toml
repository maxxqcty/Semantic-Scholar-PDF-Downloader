[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-scholar-pdf-downloader"
version = "3.0.0"
description = "Download open-access research PDFs from Semantic Scholar."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
ssdl = "ssdl.cli:main"

[tool.setuptools]
packages = ["ssdl"]
